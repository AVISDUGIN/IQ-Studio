<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d18" />
    <meta name="description" content="IQ Studio — بطولات، برامج، وأخبار مجتمعنا." />
    <title>IQ Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <a class="brand" href="#home" aria-label="IQ Studio الصفحة الرئيسية">
          <span class="brand-mark">IQ</span><span class="brand-name">IQ Studio</span>
        </a>
        <nav class="main-nav" aria-label="القائمة الرئيسية">
          <button class="nav-link active" data-route="tournaments">بطولات</button>
          <button class="nav-link" data-route="programs">برامجنا</button>
          <button class="nav-link" data-route="news">أخبار</button>
          <button class="nav-link" data-route="servers">سيرفرات</button>
        </nav>
        <div class="header-actions" id="header-actions">
          <button class="button button-quiet" data-auth="login">تسجيل الدخول</button>
          <button class="button button-primary" data-auth="register">التسجيل <span aria-hidden="true">↗</span></button>
        </div>
        <button class="mobile-menu" id="mobile-menu" aria-label="فتح القائمة" aria-expanded="false"><span></span><span></span></button>
      </header>

      <main id="main-content" tabindex="-1"></main>

      <footer class="site-footer">
        <a class="brand footer-brand" href="#home"><span class="brand-mark">IQ</span><span class="brand-name">IQ Studio</span></a>
        <span>مساحة تجمع المنافسة والإبداع.</span>
        <span class="footer-copy">© <span id="year"></span> IQ Studio</span>
      </footer>
      <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
      <div id="modal-root"></div>
      <button id="developer-button" class="developer-fab" hidden>خيارات المطور <span aria-hidden="true">⚙</span></button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
